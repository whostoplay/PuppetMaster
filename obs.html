<!DOCTYPE html>
<html>
<head>
    <title>Puppet Master</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent; /* Makes the background transparent */
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <img id="puppet" src="" />
    <script>
        const img = document.getElementById('puppet');
        const socket = new WebSocket('ws://127.0.0.1:8080/obs');

        let activeEffect = null;
        let startTime = 0;

        socket.onmessage = function(event) {
            const serverState = JSON.parse(event.data);
            const newImg = new Image();
            newImg.onload = () => {
                img.src = newImg.src;
                if (serverState.effect) {
                    if (!activeEffect || activeEffect.name !== serverState.effect.name) {
                        startTime = Date.now();
                    }
                    activeEffect = serverState.effect;
                } else {
                    activeEffect = null;
                }
            }
            newImg.src = `http://127.0.0.1:8080/uploads/${serverState.imageName}`;
        };

        function animate() {
            if (activeEffect) {
                const elapsedTime = Date.now() - startTime;

                // Scale
                let scaleX = activeEffect.scaleX;
                let scaleY = activeEffect.scaleY;
                if (activeEffect.scaleSpeed > 0) {
                    const angle = (elapsedTime / (1000 / (activeEffect.scaleSpeed + 1))) * 2 * Math.PI;
                    scaleX = 1 + (Math.sin(angle) * (activeEffect.scaleX - 1));
                    scaleY = 1 + (Math.sin(angle) * (activeEffect.scaleY - 1));
                }

                // Rotation
                let rotation = 0;
                if (activeEffect.spinSpeed > 0) {
                    rotation = (elapsedTime * activeEffect.spinSpeed * 10 / 1000) % 360;
                    rotation *= activeEffect.spinDirection;
                }

                // Vibration
                let offsetX = 0;
                let offsetY = 0;
                if (activeEffect.vibrationDistance > 0) {
                    const maxOffset = img.width / 20;
                    const offset = activeEffect.vibrationDistance * maxOffset;
                    const angle = (elapsedTime / (100 / (activeEffect.vibrationSpeed + 1))) * 2 * Math.PI;
                    offsetX = Math.sin(angle) * offset;
                    offsetY = Math.sin(angle * 2) * offset;
                }

                img.style.transform = `scale(${scaleX}, ${scaleY}) rotate(${rotation}deg) translate(${offsetX}px, ${offsetY}px)`;
                
                // Glow
                img.style.filter = `brightness(${1 + activeEffect.glowIntensity})`;

            } else {
                img.style.transform = 'scale(1) rotate(0deg) translate(0px, 0px)';
                img.style.filter = 'brightness(1)';
            }

            requestAnimationFrame(animate);
        }

        socket.onopen = function(event) {
            console.log("Connected to Puppet Master server.");
            requestAnimationFrame(animate);
        };

        socket.onclose = function(event) {
            console.log("Disconnected from Puppet Master server. Reconnecting in 1 second...");
            setTimeout(() => {
                location.reload(); 
            }, 1000);
        };

        socket.onerror = function(error) {
            console.error("WebSocket Error: ", error);
        };
    </script>
</body>
</html>
