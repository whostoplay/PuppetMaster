<!DOCTYPE html>
<html>
<head>
    <title>Puppet Master</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: transparent; /* Makes the background transparent */
        }
        #puppet {
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
        }
    </style>
</head>
<body>
<div id="puppet"></div>
<script>
    const puppetElement = document.getElementById('puppet');
    const socket = new WebSocket('ws://127.0.0.1:8080/obs');

    let activeEffect = null;
    let startTime = 0;

    function intToCssColor(colorInt) {
        const a = ((colorInt >> 24) & 0xFF) / 255;
        const r = (colorInt >> 16) & 0xFF;
        const g = (colorInt >> 8) & 0xFF;
        const b = colorInt & 0xFF;
        return `rgba(${r}, ${g}, ${b}, ${a})`;
    }

    socket.onmessage = function(event) {
        const serverState = JSON.parse(event.data);
        const puppetStateInfo = serverState.puppetStateInfo;

        if (!puppetStateInfo || !puppetStateInfo.imageName) {
            puppetElement.style.backgroundImage = '';
            activeEffect = null;
            return;
        }

        const newImg = new Image();
        newImg.onload = () => {
            puppetElement.style.backgroundImage = `url(${newImg.src})`;
            if (puppetStateInfo.appliedEffect) {
                if (!activeEffect || activeEffect.name !== puppetStateInfo.appliedEffect.name) {
                    startTime = Date.now();
                }
                activeEffect = puppetStateInfo.appliedEffect;
            } else {
                activeEffect = null;
            }
        }
        newImg.src = `http://127.0.0.1:8080/uploads/${puppetStateInfo.imageName}`;
    };

    function getAnimatedScale(targetScale, scaleSpeed, elapsedTime) {
        if (scaleSpeed === 0) {
            return targetScale;
        }
        const angle = (elapsedTime / (1000 / (scaleSpeed + 1))) * 2 * Math.PI;
        return 1 + (Math.sin(angle) * (targetScale - 1));
    }

    function animate() {
        let transform = 'scale(1) rotate(0deg) translate(0px, 0px)';
        let filter = 'none';

        if (activeEffect) {
            const elapsedTime = Date.now() - startTime;

            // Scale
            const scaleX = getAnimatedScale(activeEffect.scaleX, activeEffect.scaleSpeed, elapsedTime);
            const scaleY = getAnimatedScale(activeEffect.scaleY, activeEffect.scaleSpeed, elapsedTime);

            // Rotation
            let rotation = 0;
            if (activeEffect.spinSpeed > 0) {
                rotation = (elapsedTime * activeEffect.spinSpeed * 10 / 50) % 360;
                rotation *= activeEffect.spinDirection;
            }

            // Vibration
            let offsetX = 0;
            let offsetY = 0;
            if (activeEffect.vibrationDistance > 0) {
                const maxOffset = puppetElement.clientWidth / 50;
                const offset = activeEffect.vibrationDistance * maxOffset;
                const angle = (elapsedTime / (100 / (activeEffect.vibrationSpeed + 1))) * 2 * Math.PI;
                offsetX = Math.sin(angle) * offset;
                offsetY = Math.sin(angle * 2) * offset;
            }

            transform = `scale(${scaleX}, ${scaleY}) rotate(${rotation}deg) translate(${offsetX}px, ${offsetY}px)`;

            // Filters
            const filters = [];

            // Glow
            if (activeEffect.glowIntensity > 0) {
                const glowBlur = activeEffect.glowIntensity * 5;
                const glowColor = intToCssColor(activeEffect.glowColor);
                filters.push(`drop-shadow(0 0 ${glowBlur}px ${glowColor})`);
            }

            // Brightness
            filters.push(`brightness(${activeEffect.brightness})`);

            // Hue Shift
            filters.push(`hue-rotate(${activeEffect.hueShift}deg)`);

            if (filters.length > 0) {
                filter = filters.join(' ');
            }
            
            // Color Tint & Transparency
            const color = intToCssColor(activeEffect.colorTint);
            puppetElement.style.backgroundColor = color;
            puppetElement.style.backgroundBlendMode = 'color';
            puppetElement.style.opacity = activeEffect.transparency;

        } else {
             puppetElement.style.backgroundColor = 'transparent';
             puppetElement.style.opacity = 1;
             puppetElement.style.backgroundBlendMode = 'normal';
        }

        puppetElement.style.transform = transform;
        puppetElement.style.filter = filter;

        requestAnimationFrame(animate);
    }

    socket.onopen = function(event) {
        console.log("Connected to Puppet Master server.");
        requestAnimationFrame(animate);
    };

    socket.onclose = function(event) {
        console.log("Disconnected from Puppet Master server. Reconnecting in 1 second...");
        setTimeout(() => {
            location.reload();
        }, 1000);
    };

    socket.onerror = function(error) {
        console.error("WebSocket Error: ", error);
    };
</script>
</body>
</html>
